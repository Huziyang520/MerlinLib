# Important Notes:
# Every field you add must be added to build-logic/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=0.9.2
group=com.huziyang520.merlinlib
java_version=25

# Common
# This branch covers 26.1 ~ 26.2 and compiles against the lower bound (26.1.2), so one jar runs
# on both versions.
minecraft_version=26.1.2
# Slug of the supported Minecraft range, used only for the artifact file name
# (merlinlib-0.9.1-fabric-26.1-26.2.jar). Never used in any template.
minecraft_version_slug=26.1-26.2
mod_name=MerlinLib
mod_author=Huziyang520
mod_id=merlinlib
license=CC0-1.0
credits=
# Single line only: this value is expanded into both fabric.mod.json (a JSON string) and
# neoforge.mods.toml. A real newline here produces invalid JSON/TOML, so keep it on one line.
# The Chinese part is written as \uXXXX escapes on purpose: gradle.properties is decoded with
# ISO-8859-1 semantics, raw non-ASCII bytes would end up as mojibake in the mod list.
description=A shared library for mod developers: enchantment, effect and potion APIs, join notices, loot and mob behaviour hooks, plus a built-in testing toolkit. | Feedback: https://github.com/Huziyang520/MerlinLib/issues | Backup feedback: https://issue.mengcai.online/
minecraft_version_range=[26.1,26.3)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
## 26.1.2 is the lower bound of this branch.
neo_form_version=26.1.2-1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.155.2+26.1.2
fabric_loader_version=0.18.6

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.1.2.94
# 26.1-26.2 still declare modLoader / loaderVersion in neoforge.mods.toml, so the loader range
# property is required here (26.3 dropped it).
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
