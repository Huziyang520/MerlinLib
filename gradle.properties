# Important Notes:
# Every field you add must be added to build-logic/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=0.8.5
group=com.huziyang520.merlinlib
java_version=25

# Common
minecraft_version=26.3
mod_name=MerlinLib
mod_author=Huziyang520
mod_id=merlinlib
license=MIT
credits=
# Single line only: this value is expanded into both fabric.mod.json (a JSON string) and
# neoforge.mods.toml. A real newline here produces invalid JSON/TOML, so keep it on one line.
# The Chinese part is written as \uXXXX escapes on purpose: gradle.properties is decoded with
# ISO-8859-1 semantics, raw non-ASCII bytes would end up as mojibake in the mod list.
description=A shared library for mod developers: enchantment, effect and potion APIs, join notices, loot and mob behaviour hooks, plus a built-in testing toolkit.
minecraft_version_range=[26.3, 26.4)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.160.6+26.3
fabric_loader_version=0.19.5

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
# 26.3 dropped modLoader / loaderVersion from neoforge.mods.toml, so there is no loader version range property anymore.
neoforge_version=26.3.0.1-beta

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
