# Important Notes:
# Every field used by META-INF/mods.toml / pack.mcmeta must also be listed in build.gradle's
# replaceProperties map, otherwise the placeholder is left unexpanded in the shipped jar.
#
# This is the Minecraft 1.20.1 / Forge line. The 26.3 line lives in ../26.3 and shares nothing
# with this project: separate Gradle build, separate git repository, separate output.

# Project
version=0.8.6
group=com.huziyang520.merlinlib
java_version=17

# Common
minecraft_version=1.20.1
mod_name=MerlinLib
mod_author=Huziyang520
mod_id=merlinlib
license=MIT
credits=
# Single line only. This value is expanded into mods.toml as a TOML basic string; a real newline
# produces "Invalid newline in basic string" and the whole jar is rejected as "not a valid mod file".
description=A shared library for mod developers: enchantment, effect and potion APIs, join notices, loot and mob behaviour hooks, plus a built-in testing toolkit. \\nFeedback: https://github.com/Huziyang520/MerlinLib/issues | https://issue.mengcai.online/
minecraft_version_range=[1.20.1, 1.21)

# Forge, see https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml
# 1.20.1 = the 47.x line, 135 builds. The test instance runs 47.4.20, so the loader range below
# must stay wide enough to accept it.
forge_version=47.4.26
forge_loader_version_range=[47,)

# Gradle
# en locale + UTF-8 keep javac diagnostics readable in this shell.
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
org.gradle.daemon=false
