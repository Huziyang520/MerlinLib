# Important Notes:
# Every field used by META-INF/neoforge.mods.toml / pack.mcmeta must also be listed in build.gradle's
# replaceProperties map, otherwise the placeholder is left unexpanded in the shipped jar.
#
# This is the Minecraft 1.21.1 / NeoForge line, single module. The 1.20.1 Forge line and the 26.3
# MultiLoader line are separate Gradle builds in their own directories and share nothing with it.

# Project
version=0.9.0
group=com.huziyang520.merlinlib
java_version=21

# Common
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
mod_name=MerlinLib
mod_author=Huziyang520
mod_id=merlinlib
license=MIT
credits=
# Single line only: this value is expanded into neoforge.mods.toml as a TOML basic string; a real
# newline produces "Invalid newline in basic string" and the whole jar is rejected as "not a valid
# mod file". The Chinese part is written as \uXXXX escapes because gradle.properties is decoded
# with ISO-8859-1 semantics, so raw non-ASCII bytes would end up as mojibake in the mod list.
#
# The key is mod_description and not description on purpose: Gradle already owns Project#description
# (it defaults to a build-script sentence), so a gradle.properties key named description is shadowed
# and would expand into neoforge.mods.toml as that default instead of this text.
mod_description=A shared library for mod developers: enchantment, effect and potion APIs, join notices, loot and mob behaviour hooks, plus a built-in testing toolkit. | Feedback: https://issue.mengcai.online/

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge
neo_version=21.1.233
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# Gradle
# en locale + UTF-8 keep javac diagnostics readable in this shell.
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configuration-cache=false
