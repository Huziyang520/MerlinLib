def sharedJava = layout.buildDirectory.dir('shared/java')
def sharedResources = layout.buildDirectory.dir('shared/resources')

tasks.register('sharedJava', Sync) {
    from('../../common/src/main/java') {
        overlaidJava.each { exclude it }
        droppedJava.each { exclude it }
    }
    from('overlay/java')
    into sharedJava
}

tasks.register('sharedResources', Sync) {
    // overlay 要覆盖 common 的同名资源（lang、enchantment json 等），后写入者胜
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    from('../../common/src/main/resources') {
        // mixin 配置由 overlay 提供：1.21.1 的 compatibilityLevel 是 JAVA_21，且多一个 MixinGuiGraphics
        exclude 'merlinlib.mixins.json'

        // 1.21.1 不读 assets/<ns>/items/（1.21.4 才引入 item model definitions）
        exclude 'assets/merlinlib/items/**'

        // 1.21.1 线没有 test_spear 这个工具（模型只在 26.x 存在），与 1.21.1 目标既有资源集保持一致
        exclude 'assets/merlinlib/models/item/test_spear.json'
        exclude 'assets/merlinlib/models/item/test_spear_in_hand.json'
    }
    from('overlay/resources')
    into sharedResources
}

tasks.named('compileJava') { dependsOn 'sharedJava' }
tasks.named('processResources') { dependsOn 'sharedResources' }

sourceSets {
    main {
        java {
            setSrcDirs([])
            srcDir sharedJava
        }
        resources {
            setSrcDirs([])
            srcDir sharedResources
            // 本目标独有、common 侧没有对应文件的资源：
            // neoforge.mods.toml / merlinlib.neoforge.mixins.json / pack.mcmeta / merlinlib.png / META-INF/services
            srcDir 'src/main/resources'
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    filteringCharset = 'UTF-8'

    var replaceProperties = [
            minecraft_version      : minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version, neo_version_range: neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id, mod_name: mod_name, mod_license: license, mod_version: version,
            mod_authors            : mod_author, mod_description: mod_description,
            mod_credits            : credits,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : mod_author,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_author,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'Built-On-Minecraft'      : minecraft_version,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '1000']
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}