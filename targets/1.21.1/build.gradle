        'com/huziyang520/merlinlib/api/DropApi.java',
        'com/huziyang520/merlinlib/impl/DropGate.java',
        // 26.3 的效果账本 API 及其后端：1.21.1 侧没有效果账本概念
        'com/huziyang520/merlinlib/api/EffectLedger.java',
        'com/huziyang520/merlinlib/impl/EffectLedgerStore.java',
        // 26.3 的村民交易 API 及其后端：1.21.1 线没有交易注册表
        'com/huziyang520/merlinlib/api/TradeApi.java',
        'com/huziyang520/merlinlib/impl/TradeRegistry.java',
        // 26.3 的配置栈（ClientOptions / ServerOptions / ConfigOption / TomlBackend）：
        // 1.21.1 用 NeoForge ModConfigSpec，即 overlay 里的 NeoSpecBackend + ClientConfig/ServerConfig
        'com/huziyang520/merlinlib/config/ClientOptions.java',
        'com/huziyang520/merlinlib/config/ServerOptions.java',
        'com/huziyang520/merlinlib/config/ConfigOption.java',
        'com/huziyang520/merlinlib/config/TomlBackend.java',
        // 引用了 net.minecraft.resources.Identifier（26.x 改名后的 ResourceLocation），
        // 1.21.1 只有 ResourceLocation，编译不过；1.21.1 用 overlay 里的 impl/IdValidator
        'com/huziyang520/merlinlib/config/Coefficients.java',
        'com/huziyang520/merlinlib/impl/ContentValidator.java',
