# Forge 1.20.1 mod metadata.
#
# This file is META-INF/mods.toml, the loader's own name for it. Dependencies say `mandatory`,
# the icon is `logoFile`, and the mixin configuration is announced in the jar manifest rather
# than here, because Forge 1.20.1's ModFileParser knows no `[[mixins]]` key.
modLoader="javafml"
loaderVersion="${forge_loader_version_range}"
license="${license}"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
authors="${mod_author}"
credits="${credits}"
description="${description}"
logoFile="${mod_id}.png"
displayURL="https://www.curseforge.com/minecraft/mc-mods/merlinlib"
issueTrackerURL="https://github.com/Huziyang520/MerlinLib/issues"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_loader_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    # Optional: with it installed the mods list draws the configuration screen with Jupiter; without it the
    # switches stay in the toml files and the commands still read and write them.
    modId="jupiter"
    mandatory=false
    versionRange="[2.3.7,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    # Optional, and preferred when present: the same switches in a Cloth Config screen. The modId is
    # "cloth_config", not "cloth-config" - read off the jar's own META-INF/mods.toml; a wrong spelling here
    # would make Forge report a missing dependency that is in fact installed.
    modId="cloth_config"
    mandatory=false
    versionRange="[11.0.0,)"
    ordering="NONE"
    side="CLIENT"
