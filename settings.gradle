pluginManagement {
    repositories {
        maven {
            name = 'Aliyun Gradle Plugin Portal'
            url = 'https://maven.aliyun.com/repository/gradle-plugin'
        }
        gradlePluginPortal()
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Sponge Snapshots'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// Must match the folder name, otherwise IDEA complains (https://youtrack.jetbrains.com/issue/IDEA-317606).
rootProject.name = 'MerlinLib-1.20.1'
